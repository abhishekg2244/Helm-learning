{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test-connection"
  labels:
    {{- include "abapp.labels" . | nindent 4 }}
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "abapp.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
{{- end }}