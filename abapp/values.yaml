replicaCount: 1
image:
  repository: nginx
  tag: "latest"
service:
  type: NodePort
  port: 8080

serviceAccount:
  create: false
  
ingress:
  enabled: false
  annotations: {}
  hosts:
    - host: chart-example.local
      paths: []
  tls: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

tests:
  enabled: false