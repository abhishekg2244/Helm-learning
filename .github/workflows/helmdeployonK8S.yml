name: Helm Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Helm
        uses: azure/setup-helm@v3

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      # Optional: Docker build step (enable later if needed)
      # - name: Build Docker Image
      #   run: |
      #     IMAGE=myrepo/myapp:${{ github.sha }}
      #     docker build -t $IMAGE .
      #     minikube image load $IMAGE

      - name: Helm Lint
        run: helm lint ./abapp

      - name: Helm Deploy
        run: |
          helm upgrade --install abapp ./abapp 
            # --set image.repository=myrepo/myapp \
            # --set image.tag=${{ github.sha }}

      - name: Helm Test
        if: ${{ always() && false }}
        run: helm test abapp

